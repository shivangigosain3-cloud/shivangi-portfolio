<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="760" height="420" fill="#ffffff"/>
  <!-- panel -->
  <polygon points="60,100 560,60 700,150 200,220" fill="#eef4fb" stroke="#2b4a6b" stroke-width="2"/>
  <!-- rivet rows top edge -->
  <g stroke="#2b4a6b" stroke-width="1.5" fill="none">
    <line x1="80" y1="97" x2="80" y2="112"/><line x1="140" y1="90" x2="140" y2="105"/>
    <line x1="200" y1="84" x2="200" y2="99"/><line x1="260" y1="78" x2="260" y2="93"/>
    <line x1="320" y1="72" x2="320" y2="87"/><line x1="380" y1="66" x2="380" y2="81"/>
    <line x1="440" y1="66" x2="440" y2="81"/><line x1="500" y1="63" x2="500" y2="78"/>
  </g>
  <!-- bottom edge rivets -->
  <g stroke="#2b4a6b" stroke-width="1.5" fill="none">
    <line x1="220" y1="210" x2="220" y2="225"/><line x1="290" y1="200" x2="290" y2="215"/>
    <line x1="360" y1="190" x2="360" y2="205"/><line x1="430" y1="180" x2="430" y2="195"/>
    <line x1="500" y1="170" x2="500" y2="185"/><line x1="570" y1="158" x2="570" y2="173"/>
  </g>
  <!-- penetration -->
  <circle cx="360" cy="150" r="34" fill="#ffffff" stroke="#c0432c" stroke-width="2.5"/>
  <text x="330" y="120" font-size="12" fill="#c0432c">ADD PENETRATION</text>
  <!-- tangent lines -->
  <line x1="326" y1="150" x2="326" y2="60" stroke="#c0432c" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="394" y1="150" x2="394" y2="60" stroke="#c0432c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="330" y="55" font-size="10" fill="#c0432c">TANGENT LINE</text>
  <text x="398" y="55" font-size="10" fill="#c0432c">TANGENT LINE</text>
  <!-- extra fasteners around hole -->
  <g stroke="#2b4a6b" stroke-width="1.5" fill="none">
    <line x1="336" y1="108" x2="336" y2="122"/><line x1="384" y1="108" x2="384" y2="122"/>
    <line x1="336" y1="178" x2="336" y2="192"/><line x1="384" y1="178" x2="384" y2="192"/>
  </g>
  <!-- bracket -->
  <g stroke="#2b4a6b" stroke-width="2" fill="#dfe9f5">
    <rect x="470" y="130" width="55" height="14" />
    <rect x="470" y="130" width="14" height="70" />
  </g>
  <text x="470" y="222" font-size="12" fill="#2b4a6b">BRACKET</text>
  <!-- fasteners on bracket -->
  <circle cx="480" cy="136" r="2.4" fill="#2b4a6b"/>
  <circle cx="515" cy="136" r="2.4" fill="#2b4a6b"/>
  <circle cx="480" cy="160" r="2.4" fill="#2b4a6b"/>
  <circle cx="480" cy="185" r="2.4" fill="#2b4a6b"/>
  <!-- load arrow -->
  <line x1="600" y1="150" x2="530" y2="150" stroke="#c0432c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="605" y="154" font-size="13" fill="#c0432c">APPLIED LOAD</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0432c"/>
    </marker>
  </defs>
  <text x="60" y="260" font-size="11" fill="#7a8ba0">generic re-sketch — spacing, hole size, and bracket dimensions not reproduced</text>
</svg>
