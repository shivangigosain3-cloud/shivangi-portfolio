<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace" font-size="12">
  <rect width="800" height="420" fill="#ffffff"/>

  <!-- occupant -->
  <circle cx="150" cy="90" r="18" fill="#eef4fb" stroke="#2b4a6b" stroke-width="2"/>
  <line x1="150" y1="108" x2="150" y2="150" stroke="#2b4a6b" stroke-width="2"/>
  <line x1="150" y1="150" x2="130" y2="185" stroke="#2b4a6b" stroke-width="2"/>
  <line x1="150" y1="150" x2="170" y2="185" stroke="#2b4a6b" stroke-width="2"/>
  <text x="115" y="70" fill="#2b4a6b">OCCUPANT</text>

  <!-- inertial load arrow -->
  <line x1="150" y1="40" x2="150" y2="70" stroke="#c0432c" stroke-width="3" marker-end="url(#a1)"/>
  <text x="160" y="45" fill="#c0432c">9g FWD / VERT INERTIAL LOAD</text>

  <!-- seat pan -->
  <rect x="110" y="185" width="90" height="14" fill="#dfe9f5" stroke="#2b4a6b" stroke-width="2"/>
  <text x="112" y="215" fill="#2b4a6b">SEAT PAN</text>

  <!-- seat legs -->
  <line x1="120" y1="199" x2="105" y2="270" stroke="#2b4a6b" stroke-width="3"/>
  <line x1="190" y1="199" x2="205" y2="270" stroke="#2b4a6b" stroke-width="3"/>
  <text x="70" y="255" fill="#2b4a6b">SEAT LEGS</text>

  <!-- arrow down to track fitting -->
  <line x1="150" y1="205" x2="150" y2="265" stroke="#c0432c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a1)"/>

  <!-- track fitting -->
  <rect x="95" y="270" width="120" height="16" fill="#eef4fb" stroke="#2b4a6b" stroke-width="2"/>
  <text x="90" y="302" fill="#2b4a6b">SEAT TRACK FITTING</text>

  <!-- arrow to floor beam -->
  <line x1="215" y1="278" x2="330" y2="278" stroke="#c0432c" stroke-width="2.5" marker-end="url(#a1)"/>

  <!-- floor beam -->
  <rect x="330" y="260" width="260" height="20" fill="#dfe9f5" stroke="#2b4a6b" stroke-width="2"/>
  <text x="330" y="300" fill="#2b4a6b">CABIN FLOOR BEAM</text>

  <!-- arrow to frame -->
  <line x1="590" y1="270" x2="680" y2="270" stroke="#c0432c" stroke-width="2.5" marker-end="url(#a1)"/>

  <!-- fuselage frame (arc) -->
  <path d="M700,90 A150,150 0 0 1 700,390" fill="none" stroke="#2b4a6b" stroke-width="3"/>
  <text x="705" y="240" fill="#2b4a6b">FUSELAGE FRAME</text>
  <text x="705" y="255" fill="#2b4a6b">/ SKIN</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0432c"/>
    </marker>
  </defs>

  <text x="30" y="390" fill="#7a8ba0" font-size="11">simplified, general concept — occupant → seat pan → legs → track fitting → floor beam → frame/skin</text>
</svg>
